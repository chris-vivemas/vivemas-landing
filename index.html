<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivemás</title>
 
<style>
 
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
}
 
body {
position: relative;
font-family: "Segoe UI", Arial, sans-serif;
background: #000;
}
 
.slideshow {
position: fixed;
inset: 0;
}
 
.slide {
position: absolute;
inset: 0;
opacity: 0;
animation: fade 18s infinite;
}
 
.slide:nth-child(1) {
animation-delay: 0s;
}
 
.slide:nth-child(2) {
animation-delay: 6s;
}
 
.slide:nth-child(3) {
animation-delay: 12s;
}
 
.slide img {
width: 100%;
height: 100%;
object-fit: cover;
}
 
@keyframes fade {
0% { opacity: 0; }
5% { opacity: 1; }
28% { opacity: 1; }
33% { opacity: 0; }
100% { opacity: 0; }
}
 
</style>
 
</head>
 
<body>
 
<div class="slideshow">
 
<div class="slide">
sparß.png
</div>
 
<div class="slide">
<img src="level.png" alt="Neues Ziel freigeschaltet">
</div>
 
<div class="slide">
<img src="stimme.png" alt="Dein Geld hat eine Stimme">
</div>
 
</div>
 
</body>
</html>
</div>
 
</body>
</html>
